apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-java-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-java

  template:
    metadata:
      labels:
        app: hello-java

    spec:
      containers:
        - name: hello-java-container
          image: sunainakandukuri/hello-java-app:latest
          imagePullPolicy: Always
          args: ["Sunaina"]
